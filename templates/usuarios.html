<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/litera/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2>Gestión de Usuarios</h2>

    <hr />

    <h4>Buscar un Usuario</h4>
    <form action="/buscar_usuario" class="row g-2 align-items-center mb-4">
        <div class="col-auto">
            <label class="form-label">Escriba la cédula:</label>
        </div>
        <div class="col-auto">
            <input type="text" class="form-control" name="cedula" />
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
    </form>

    <hr />

    <h4>Insertar un Usuario</h4>
    <form action="/insertar_usuario">
        <table class="table table-bordered w-50">
            <tr>
                <th>Cédula</th>
                <td><input type="text" class="form-control" name="cedula" /></td>
            </tr>
            <tr>
                <th>Nombre</th>
                <td><input type="text" class="form-control" name="nombre" /></td>
            </tr>
            <tr>
                <th>Apellido</th>
                <td><input type="text" class="form-control" name="apellido" /></td>
            </tr>
            <tr>
                <th>Teléfono</th>
                <td><input type="text" class="form-control" name="telefono" /></td>
            </tr>
            <tr>
                <th>Correo</th>
                <td><input type="text" class="form-control" name="correo" /></td>
            </tr>
            <tr>
                <th>Dirección</th>
                <td><input type="text" class="form-control" name="direccion" /></td>
            </tr>
        </table>
        <button type="submit" class="btn btn-success">Guardar</button>
    </form>

    <hr />

    <h4>Modificar un Usuario</h4>
    <form action="/modificar_usuario" class="row g-2 align-items-center mb-4">
        <div class="col-auto">
            <label class="form-label">Escriba la cédula:</label>
        </div>
        <div class="col-auto">
            <input type="text" class="form-control" name="cedula" />
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-warning">Buscar para modificar</button>
        </div>
    </form>

    <hr />

    <p>Si es la primera vez que usa esta aplicación, <a href="/crear_tablas">haga click aquí para crear las tablas en la base de datos</a></p>

    <a href="/" class="btn btn-secondary">Volver al inicio</a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
