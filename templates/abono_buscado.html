<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/litera/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Abono encontrado</h2>
    <table class="table table-bordered">
        <tr>
            <th>ID Abono</th>
            <td>{{ abono.id_abono }}</td>
        </tr>
        <tr>
            <th>ID Plan</th>
            <td>{{ abono.id_plan }}</td>
        </tr>
        <tr>
            <th>Mes del abono</th>
            <td>{{ abono.mes_abono }}</td>
        </tr>
        <tr>
            <th>Valor abono ($)</th>
            <td>{{ abono.valor_abono }}</td>
        </tr>
        <tr>
            <th>Nueva cuota ($)</th>
            <td>{{ abono.nueva_cuota }}</td>
        </tr>
    </table>
    <a href="/abonos" class="btn btn-secondary">Volver</a>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
