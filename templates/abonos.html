<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/litera/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2>Gestión de Abonos</h2>

    <hr />

    <h4>Buscar un Abono</h4>
    <form action="/buscar_abono" class="row g-2 align-items-center mb-4">
        <div class="col-auto">
            <label class="form-label">Escriba el ID del abono:</label>
        </div>
        <div class="col-auto">
            <input type="text" class="form-control" name="id_abono" />
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
    </form>

    <hr />

    <h4>Insertar un Abono</h4>
    <form action="/insertar_abono">
        <table class="table table-bordered w-50">
            <tr>
                <th>ID Plan</th>
                <td><input type="number" class="form-control" name="id_plan" /></td>
            </tr>
            <tr>
                <th>Mes del abono</th>
                <td><input type="number" class="form-control" name="mes_abono" /></td>
            </tr>
            <tr>
                <th>Valor abono ($)</th>
                <td><input type="text" class="form-control" name="valor_abono" /></td>
            </tr>
            <tr>
                <th>Nueva cuota ($) <i>(opcional)</i></th>
                <td><input type="text" class="form-control" name="nueva_cuota" value="0" /></td>
            </tr>
        </table>
        <button type="submit" class="btn btn-success">Guardar</button>
    </form>

    <hr />

    <h4>Modificar un Abono</h4>
    <form action="/modificar_abono" class="row g-2 align-items-center mb-4">
        <div class="col-auto">
            <label class="form-label">Escriba el ID del abono:</label>
        </div>
        <div class="col-auto">
            <input type="text" class="form-control" name="id_abono" />
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-warning">Buscar para modificar</button>
        </div>
    </form>

    <hr />

    <p>Si es la primera vez que usa esta aplicación, <a href="/crear_tablas">haga click aquí para crear las tablas en la base de datos</a></p>

    <a href="/" class="btn btn-secondary">Volver al inicio</a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
