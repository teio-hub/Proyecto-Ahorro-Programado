<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/litera/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2>Planes encontrados</h2>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Cédula</th>
                <th>Meta ($)</th>
                <th>Tasa</th>
                <th>Plazo</th>
                <th>Cuota mensual ($)</th>
                <th>Fecha creación</th>
            </tr>
        </thead>
        <tbody>
            {% for plan in planes %}
            <tr>
                <td>{{ plan.id_plan }}</td>
                <td>{{ plan.cedula }}</td>
                <td>{{ plan.meta }}</td>
                <td>{{ plan.tasa_interes }}</td>
                <td>{{ plan.plazo }}</td>
                <td>{{ plan.cuota_mensual }}</td>
                <td>{{ plan.fecha_creacion }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/planes" class="btn btn-secondary">Volver</a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
