<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/litera/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2>Modificar Plan de Ahorro</h2>

    <form action="/actualizar_plan">
        <table class="table table-bordered w-50">
            <tr>
                <th>ID Plan</th>
                <td><input type="text" class="form-control" name="id_plan" value="{{ plan.id_plan }}" readonly /></td>
            </tr>
            <tr>
                <th>Cédula</th>
                <td><input type="text" class="form-control" name="cedula" value="{{ plan.cedula }}" /></td>
            </tr>
            <tr>
                <th>Meta ($)</th>
                <td><input type="text" class="form-control" name="meta" value="{{ plan.meta }}" /></td>
            </tr>
            <tr>
                <th>Tasa de interés</th>
                <td><input type="text" class="form-control" name="tasa_interes" value="{{ plan.tasa_interes }}" /></td>
            </tr>
            <tr>
                <th>Plazo (meses)</th>
                <td><input type="number" class="form-control" name="plazo" value="{{ plan.plazo }}" /></td>
            </tr>
            <tr>
                <th>Cuota mensual ($)</th>
                <td><input type="text" class="form-control" name="cuota_mensual" value="{{ plan.cuota_mensual }}" /></td>
            </tr>
            <tr>
                <th>Fecha creación</th>
                <td><input type="date" class="form-control" name="fecha_creacion" value="{{ plan.fecha_creacion }}" /></td>
            </tr>
        </table>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </form>

    <br />

    <form action="/eliminar_plan">
        <input type="hidden" name="id_plan" value="{{ plan.id_plan }}" />
        <button type="submit" class="btn btn-danger">Eliminar plan</button>
    </form>

    <br />

    <a href="/planes" class="btn btn-secondary">Volver</a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
