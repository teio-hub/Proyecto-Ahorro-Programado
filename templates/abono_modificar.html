<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/litera/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Modificar Abono</h2>
    <form action="/actualizar_abono">
        <table class="table table-bordered">
            <tr>
                <th>ID Abono</th>
                <td><input type="text" class="form-control" name="id_abono" value="{{ abono.id_abono }}" readonly /></td>
            </tr>
            <tr>
                <th>ID Plan</th>
                <td><input type="number" class="form-control" name="id_plan" value="{{ abono.id_plan }}" /></td>
            </tr>
            <tr>
                <th>Mes del abono</th>
                <td><input type="number" class="form-control" name="mes_abono" value="{{ abono.mes_abono }}" /></td>
            </tr>
            <tr>
                <th>Valor abono ($)</th>
                <td><input type="text" class="form-control" name="valor_abono" value="{{ abono.valor_abono }}" /></td>
            </tr>
            <tr>
                <th>Nueva cuota ($)</th>
                <td><input type="text" class="form-control" name="nueva_cuota" value="{{ abono.nueva_cuota }}" /></td>
            </tr>
        </table>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </form>

    <br />

    <form action="/eliminar_abono">
        <input type="hidden" name="id_abono" value="{{ abono.id_abono }}" />
        <button type="submit" class="btn btn-danger">Eliminar abono</button>
    </form>

    <br />

    <a href="/abonos" class="btn btn-secondary">Volver</a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
