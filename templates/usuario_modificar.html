<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/litera/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2>Modificar Usuario</h2>

    <form action="/actualizar_usuario">
        <table class="table table-bordered w-50">
            <tr>
                <th>Cédula</th>
                <td><input type="text" class="form-control" name="cedula" value="{{ usuario.cedula }}" readonly /></td>
            </tr>
            <tr>
                <th>Nombre</th>
                <td><input type="text" class="form-control" name="nombre" value="{{ usuario.nombre }}" /></td>
            </tr>
            <tr>
                <th>Apellido</th>
                <td><input type="text" class="form-control" name="apellido" value="{{ usuario.apellido }}" /></td>
            </tr>
            <tr>
                <th>Teléfono</th>
                <td><input type="text" class="form-control" name="telefono" value="{{ usuario.telefono }}" /></td>
            </tr>
            <tr>
                <th>Correo</th>
                <td><input type="text" class="form-control" name="correo" value="{{ usuario.correo }}" /></td>
            </tr>
            <tr>
                <th>Dirección</th>
                <td><input type="text" class="form-control" name="direccion" value="{{ usuario.direccion }}" /></td>
            </tr>
        </table>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </form>

    <br />

    <a href="/usuarios" class="btn btn-secondary">Volver</a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
